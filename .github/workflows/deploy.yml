name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          GROQ_API_KEY: test-dummy-key
        run: python -m pytest tests/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/my_doctor_bot
            git pull
            systemctl restart mydoctor
            # Веб-версия (docs/web-deploy.md): перезапускаем, только если сервис уже установлен на сервере.
            if systemctl cat mydoctor-web >/dev/null 2>&1; then systemctl restart mydoctor-web; fi
